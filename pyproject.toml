[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dumme"
version = "0.1.0"
description = "DummE — cardboard robotic arm driven by Gemma on a Raspberry Pi 5"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DummE Team" }]
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pyyaml>=6.0,<7.0",
    "numpy>=1.26,<2.0",
    "opencv-python-headless>=4.10,<5.0",
    "requests>=2.32,<3.0",
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    # Pi-only (wheels unavailable on macOS/x86_64)
    "picamera2; platform_machine=='aarch64'",
    "adafruit-circuitpython-pca9685; platform_machine=='aarch64'",
    "piper-tts; platform_machine=='aarch64'",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6,<1.0",
    "black>=24.0,<26.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dumme*"]
exclude = ["scripts*", "tests*", "static*", "models*", "config*", "systemd*", "docs*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast isolated tests",
    "integration: require external services",
    "eval: hits the live llama-server; slow",
    "hardware: requires Pi + I2C + camera",
]
addopts = "-ra --strict-markers -m 'not eval and not hardware'"
